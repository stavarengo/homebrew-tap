name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 7 * * 1"

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@master

      - name: Audit formula
        run: brew audit --strict --online stavarengo/tap/mobt

      - name: Install formula from source
        run: brew install --build-from-source stavarengo/tap/mobt

      - name: Smoke test mobt CLI
        run: |
          set -euo pipefail
          mobt --help > mobt-help.txt
          grep -q "Usage:" mobt-help.txt
          mob-tool --help > mob-tool-help.txt
          grep -q "Usage:" mob-tool-help.txt
